    // Helper: Format VND Currency
    const formatVND = (num) => {
      if (!num && num !== 0) return '0₫';
      return Number(num).toLocaleString('vi-VN') + '₫';
    };

    // =========================================================================
    // 1. DATA REPOSITORY & LOCALSTORAGE MANAGER
    // =========================================================================
    const DB = {
      KEYS: {
        TUTORS: 'educonnect_tutors_v2',
        POSTS: 'educonnect_posts_v2',
        REVIEWS: 'educonnect_reviews_v2',
        BOOKINGS: 'educonnect_bookings_v2',
        USERS: 'educonnect_users_v2',
        FAVORITES: 'educonnect_favorites_v2',
        MESSAGES: 'educonnect_messages_v2',
        CURRENT_USER: 'educonnect_current_user_v2'
      },

      init() {
        const tutors = window.INITIAL_TUTORS || [];
        const posts = window.INITIAL_POSTS || [];
        const reviews = window.INITIAL_REVIEWS || [];
        const bookings = window.INITIAL_BOOKINGS || [];
        const users = window.INITIAL_USERS || [];
        const messages = window.INITIAL_MESSAGES || [];

        if (!localStorage.getItem(this.KEYS.TUTORS)) {
          localStorage.setItem(this.KEYS.TUTORS, JSON.stringify(tutors));
        }
        if (!localStorage.getItem(this.KEYS.POSTS)) {
          localStorage.setItem(this.KEYS.POSTS, JSON.stringify(posts));
        }
        if (!localStorage.getItem(this.KEYS.REVIEWS)) {
          localStorage.setItem(this.KEYS.REVIEWS, JSON.stringify(reviews));
        }
        if (!localStorage.getItem(this.KEYS.BOOKINGS)) {
          localStorage.setItem(this.KEYS.BOOKINGS, JSON.stringify(bookings));
        }
        if (!localStorage.getItem(this.KEYS.USERS)) {
          localStorage.setItem(this.KEYS.USERS, JSON.stringify(users));
        }
        if (!localStorage.getItem(this.KEYS.MESSAGES)) {
          localStorage.setItem(this.KEYS.MESSAGES, JSON.stringify(messages));
        }
        if (!localStorage.getItem(this.KEYS.CURRENT_USER) && users.length > 0) {
          localStorage.setItem(this.KEYS.CURRENT_USER, JSON.stringify(users[0]));
        }
      },

      getTutors() {
        try { return JSON.parse(localStorage.getItem(this.KEYS.TUTORS)) || window.INITIAL_TUTORS; }

    // =========================================================================
    // 2. MOTION: EDITORIAL MATHEMATICAL WAVE CANVAS (LIGHTWEIGHT & RESTFUL)
    // =========================================================================
    const EditorialHeroCanvas = () => {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;
        let width = canvas.width = canvas.offsetWidth;
        let height = canvas.height = canvas.offsetHeight;
        let time = 0;
        let isVisible = true;

        const observer = new IntersectionObserver(([entry]) => {
          isVisible = entry.isIntersecting;
        }, { threshold: 0.1 });
        observer.observe(canvas);

        const handleResize = () => {
          if (!canvas) return;
          width = canvas.width = canvas.offsetWidth;
          height = canvas.height = canvas.offsetHeight;
        };
        window.addEventListener('resize', handleResize);

        // Nodes for knowledge constellation
        const nodes = Array.from({ length: 22 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          radius: Math.random() * 2.5 + 1.5,
          glow: Math.random() > 0.6
        }));

        const render = () => {
          if (!isVisible) {
            animationFrameId = requestAnimationFrame(render);
            return;
          }

          time += 0.015;
          ctx.clearRect(0, 0, width, height);

          // Draw subtle sine wave harmonic paths
          ctx.beginPath();
          ctx.strokeStyle = 'rgba(16, 185, 129, 0.12)';
          ctx.lineWidth = 1.5;
          for (let x = 0; x < width; x += 6) {
            const y = height * 0.5 + Math.sin(x * 0.008 + time) * 45 + Math.cos(x * 0.015 - time * 0.8) * 20;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          ctx.beginPath();
          ctx.strokeStyle = 'rgba(212, 233, 86, 0.08)';
          ctx.lineWidth = 1;
          for (let x = 0; x < width; x += 6) {
            const y = height * 0.55 + Math.cos(x * 0.01 - time * 0.7) * 40;
            if (x === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.stroke();

          // Connect nearby constellation nodes
          for (let i = 0; i < nodes.length; i++) {
            const p1 = nodes[i];
            p1.x += p1.vx;
            p1.y += p1.vy;
            if (p1.x < 0 || p1.x > width) p1.vx *= -1;
            if (p1.y < 0 || p1.y > height) p1.vy *= -1;

            for (let j = i + 1; j < nodes.length; j++) {
              const p2 = nodes[j];
              const dx = p1.x - p2.x;
              const dy = p1.y - p2.y;
              const dist = Math.sqrt(dx * dx + dy * dy);
              if (dist < 120) {
                const alpha = (1 - dist / 120) * 0.18;
                ctx.beginPath();
                ctx.strokeStyle = `rgba(16, 185, 129, ${alpha})`;
                ctx.lineWidth = 0.8;
                ctx.moveTo(p1.x, p1.y);
                ctx.lineTo(p2.x, p2.y);
                ctx.stroke();
              }
            }

            // Draw node dot
            ctx.beginPath();
            ctx.arc(p1.x, p1.y, p1.radius, 0, Math.PI * 2);
            ctx.fillStyle = p1.glow ? 'rgba(212, 233, 86, 0.7)' : 'rgba(255, 255, 255, 0.4)';
            ctx.fill();
          }

          animationFrameId = requestAnimationFrame(render);
        };

        render();

        return () => {
          observer.disconnect();
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 w-full h-full pointer-events-none" />;
    };

                  const now = new Date();
                  const timeStr = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;
                  const newMsg = {
                    id: 'm-' + Date.now(),
                    sender: currentUser.role,
                    text: text,
                    time: timeStr
                  };

                  const updatedConv = {
                    ...messages[convIndex],
                    lastMessage: text,
                    lastTime: timeStr,
                    messages: [...messages[convIndex].messages, newMsg]
                  };

                  const updatedList = [...messages];
                  updatedList[convIndex] = updatedConv;
                  setMessages(updatedList);

                    ];
                    const randomReply = tutorReplies[Math.floor(Math.random() * tutorReplies.length)];

                      id: 'reply-' + Date.now(),
                      sender: 'tutor',
                      text: randomReply,
                      time: `${now.getHours().toString().padStart(2, '0')}:${(now.getMinutes() + 1).toString().padStart(2, '0')}`

                      ...updatedConv,
                      lastMessage: randomReply,
                      lastTime: replyMsg.time,
                      messages: [...updatedConv.messages, replyMsg]
                    };

                    finalList[convIndex] = finalConv;

                    DB.saveMessages(finalList);
